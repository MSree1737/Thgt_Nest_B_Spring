spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    username: ${MAIL_USERNAME:mannesri2005@gmail.com}
    password: ${MAIL_PASSWORD:}

brevo:
  api:
    key: ${BREVO_API_KEY:${MAIL_PASSWORD:}}
  sender:
    name: ${BREVO_SENDER_NAME:ThoughtNest}
    email: ${MAIL_USERNAME:mannesri2005@gmail.com}

app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}

server:
  port: ${PORT:8080}
