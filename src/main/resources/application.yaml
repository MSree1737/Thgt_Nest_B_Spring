spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    # Render/Neon commonly provide DATABASE_URL as postgresql://...;
    # PostgreSQL's JDBC driver requires the jdbc: prefix.
    url: ${DATABASE_JDBC_URL:jdbc:${DATABASE_URL}}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}
